var T={
ta:{sos:'அவசரமா? <a href="tel:108">108</a> ஐ அழைத்தால் இலவச ஆம்புலன்ஸ் வரும்',mark:"சேவா ஃபர்ஸ்ட் புத்தாக்கப் போட்டி",h1:"உங்களுக்கான மருத்துவ உதவித் திட்டங்கள்",sub:"உங்கள் தேவையைத் தேர்ந்தெடுங்கள். பொருந்தும் அரசு மருத்துவக் காப்பீடு, இலவச சிகிச்சை, நிதியுதவித் திட்டங்களையும் விண்ணப்பிக்கும் வழியையும் உடனே பாருங்கள்.",
l1:"எந்தப் பகுதி?",l2:"என்ன உதவி தேவை?",l3:"குடும்ப ஆண்டு வருமானம்",cnt:function(n){return "உங்களுக்கான "+n+" திட்டங்கள்"},go:"அதிகாரப்பூர்வ தளத்தைத் திறக்க",tn:"தமிழ்நாடு",who:"யாருக்கு: ",empty:"இந்தத் தேர்வுக்குப் பொருந்தும் திட்டம் இல்லை. வேறு தேவையைத் தேர்ந்தெடுங்கள் அல்லது வருமானத்தில் “தெரியாது” என்பதைத் தேர்ந்தெடுங்கள்.",
foot:"Developed by: Akalya A, Harini S, Madhu Bharathi E, Sukitha M, Thenmozhi A<br><br>இது பொதுத் தகவலின் அடிப்படையிலான வழிகாட்டி மட்டுமே. தொகைகள், வருமான வரம்புகள், விதிகள் மாறக்கூடும்; விண்ணப்பிக்கும் முன் அதிகாரப்பூர்வ இணையதளத்தில் அல்லது உங்கள் சுகாதார நிலையத்தில் உறுதிசெய்யுங்கள். அவசரத்தில் 108 ஐ அழைக்கவும்.",
reg:["தமிழ்நாடு","இந்தியா முழுவதும்"],sit:["குடும்பத்துக்கு மருத்துவமனைச் சிகிச்சை","கர்ப்பம் / புதிய தாய்","மூத்த குடிமக்கள்","சாலை விபத்து / அவசரம்","மாற்றுத்திறனாளி","நீரிழிவு, இரத்த அழுத்தம், நீண்டகால நோய்"],inc:["₹1.2 லட்சம் வரை","₹1.2 லட்சத்துக்கு மேல்","தெரியாது"]},
en:{sos:'Emergency? Call <a href="tel:108">108</a> for a free ambulance',mark:"Seva First Innovation Challenge",h1:"Health schemes made for you",sub:"Choose what you need. See the government health insurance, free treatment and financial aid schemes that fit, and how to apply.",
l1:"Which region?",l2:"What do you need help with?",l3:"Yearly family income",cnt:function(n){return n+(n==1?" scheme":" schemes")+" for you"},go:"Open official site",tn:"Tamil Nadu",who:"Who: ",empty:"No scheme matched this choice. Try another need, or choose “Not sure” for income.",

var P=[
{tn:1,inc:1,dis:1,s:[0,2,4,5],l:"https://www.cmchistn.com",
ta:["முதலமைச்சரின் விரிவான மருத்துவக் காப்பீட்டுத் திட்டம் (CMCHIS)","ஆண்டு வருமானம் ₹1.2 லட்சம் வரை உள்ள, குடும்ப அட்டை உள்ள தமிழ்நாட்டுக் குடும்பங்கள். மாற்றுத்திறனாளி உறுப்பினர் உள்ள குடும்பங்கள் வருமான வரம்பின்றிச் சேரலாம்.","அங்கீகரிக்கப்பட்ட அரசு மற்றும் தனியார் மருத்துவமனைகளில் குடும்பம் முழுவதற்கும் பணமில்லா சிகிச்சை. ஆண்டுக்கு ₹5 லட்சம் காப்பீடு. 2026 ஆகஸ்டில் இது ₹25 லட்சமாக உயர்த்தப்படும் என்று அறிவிக்கப்பட்டது; எப்போது நடைமுறைக்கு வரும் என்று உறுதிசெய்யுங்கள்.","கிராம நிர்வாக அலுவலரிடம் வருமானச் சான்று பெறுங்கள். குடும்ப அட்டை, ஆதார் தயாராக வைத்து, மாவட்ட ஆட்சியர் அலுவலகத்தில் உள்ள அட்டை வழங்கும் மையத்தில் சேருங்கள். உதவி எண்: 1800 425 3993."],
en:["CM’s Comprehensive Health Insurance Scheme (CMCHIS)","Tamil Nadu families with annual income up to ₹1.2 lakh and a family ration card. Families with a differently abled member can enrol without the income limit.","Cashless treatment for the whole family at empanelled government and private hospitals. Cover is ₹5 lakh per family per year. In August 2026 the state announced a rise to ₹25 lakh; check when it takes effect.","Get an income certificate from the Village Administrative Officer, keep your family ration card and Aadhaar ready, and enrol at the card centre in the District Collector’s office. Helpline: 1800 425 3993."]},
{inc:1,s:[0,2,4,5],l:"https://pmjay.gov.in",
ta:["ஆயுஷ்மான் பாரத் பிஎம்-ஜேஏஒய்","SECC 2011 அளவுகோலில் அடையாளம் காணப்பட்ட ஏழை மற்றும் பாதிக்கப்படக்கூடிய குடும்பங்கள்","அங்கீகரிக்கப்பட்ட மருத்துவமனைகளில் ஆண்டுக்கு குடும்பத்துக்கு ₹5 லட்சம் வரை பணமில்லா சிகிச்சை. குடும்ப உறுப்பினர் அனைவரும் பகிர்ந்து பயன்படுத்தலாம்.","pmjay.gov.in அல்லது ஆயுஷ்மான் செயலியில் தகுதியைச் சரிபார்த்து, ஆதார் e-KYC முடித்து அட்டையைப் பதிவிறக்குங்கள்."],
en:["Ayushman Bharat PM-JAY","Poor and vulnerable families identified under the SECC 2011 criteria","Cashless hospital treatment up to ₹5 lakh per family per year at empanelled hospitals, shared by all family members.","Check your eligibility on pmjay.gov.in or the Ayushman app, complete Aadhaar e-KYC and download your card."]},
{s:[2],l:"https://pmjay.gov.in",
ta:["ஆயுஷ்மான் வய வந்தனா அட்டை (70 வயதும் அதற்கு மேலும்)","70 வயது அல்லது அதற்கு மேற்பட்ட அனைத்து மூத்த குடிமக்கள்; வருமானம் தடையில்லை","ஆண்டுக்கு ₹5 லட்சம் வரை இலவச மருத்துவமனைச் சிகிச்சை. ஏற்கெனவே பிஎம்-ஜேஏஒய் குடும்பத்தில் உள்ள மூத்தவர்களுக்குத் தனியாக கூடுதல் ₹5 லட்சம் கிடைக்கும்.","வயது ஆதாரிலிருந்து சரிபார்க்கப்படும். pmjay.gov.in இல் அல்லது அருகிலுள்ள பொது சேவை மையத்தில் விண்ணப்பிக்கலாம்."],
en:["Ayushman Vay Vandana Card (70 and above)","Every senior citizen aged 70 or above, whatever the income","Free hospital treatment up to ₹5 lakh a year. Seniors in families already under PM-JAY get an extra ₹5 lakh just for themselves.","Age is checked from Aadhaar. Apply on pmjay.gov.in or through a nearby Common Service Centre."]},
{tn:1,s:[3],l:null,
ta:["இன்னுயிர் காப்போம் – நம்மைக் காக்கும் 48 (சாலை விபத்து)","தமிழ்நாட்டில் சாலை விபத்தில் காயமடைந்த எவரும்; பிற மாநிலத்தவர் உட்பட","அங்கீகரிக்கப்பட்ட மருத்துவமனைகளில் முதல் 48 மணி நேரத்துக்கு உயிர்காக்கும் சிகிச்சை இலவசம். வரம்பு ₹1 லட்சமாக இருந்தது; பின்னர் ₹2 லட்சமாக உயர்த்தப்பட்டது.","தனியாக விண்ணப்பிக்க வேண்டியதில்லை என்று தெரிவிக்கப்படுகிறது. காயமடைந்தவரை அருகிலுள்ள அங்கீகரிக்கப்பட்ட மருத்துவமனைக்குக் கொண்டு சென்று, சாலை விபத்து என்று சொல்லுங்கள். தொடர் சிகிச்சை CMCHIS உடன் இணைக்கப்படும்."],
en:["Innuyir Kaappom – Nammai Kaakkum 48 (road accidents)","Anyone injured in a road accident in Tamil Nadu, including people from other states","Free life-saving treatment in the first 48 hours at empanelled hospitals. The limit was ₹1 lakh and has since been raised to ₹2 lakh.","No separate application is reported. Take the injured person to the nearest empanelled hospital and say it is a road accident. Further treatment is linked to CMCHIS."]},
{tn:1,s:[5,2],l:null,
ta:["மக்களைத் தேடி மருத்துவம் (வீடு தேடி வரும் சுகாதாரச் சேவை)","உயர் இரத்த அழுத்தம் அல்லது நீரிழிவு உள்ளவர்கள்; வீட்டில் பராமரிப்பு தேவைப்படுவோர்","பெண் சுகாதாரத் தன்னார்வலர்கள் வீடுகளுக்கு வந்து (30 வயதுக்கு மேற்பட்டோருக்கு) இரத்த அழுத்தம், நீரிழிவுப் பரிசோதனை செய்து, வழக்கமான மருந்துகளை வழங்குகிறார்கள். பட்டியலில் உள்ள நோயாளிகளுக்கு வீட்டு பிசியோதெரபி, நோய்த்தணிப்புப் பராமரிப்பு, வீட்டு டயாலிசிஸ் ஆகியவையும் உண்டு.","விண்ணப்பம் தேவையில்லை. உங்கள் பகுதி பெண் சுகாதாரத் தன்னார்வலரிடம் கேளுங்கள் அல்லது அருகிலுள்ள துணை சுகாதார நிலையம் / ஆரம்ப சுகாதார நிலையத்துக்குச் செல்லுங்கள்."],
en:["Makkalai Thedi Maruthuvam (healthcare at your doorstep)","People with high blood pressure or diabetes, and others needing home care","Women health volunteers visit homes to screen for BP and diabetes (adults over 30) and deliver regular medicines. Home physiotherapy, palliative care and home dialysis are offered to listed patients.","No application. Ask your Women Health Volunteer, or visit your nearest health sub-centre or Primary Health Centre."]},
{tn:1,s:[1],l:"https://picme.tn.gov.in",
